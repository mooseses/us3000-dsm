version: 1
name: us3000
description:
  en_US: "Support for the UGREEN US3000 DC UPS (USB 2b89:ffff / 2b89:3245) in DSM. Bundles a static NUT 2.8.5 usbhid-ups (MGE subdriver, as UGREEN's own UGOS uses), wraps DSM's usbhid-ups to use it for the US3000, adds the device to DSM's UPS whitelist and driver table, and installs us3000-ctl, a root service that lets the US3000 Companion app send an allow-list of commands (beeper, battery test). Other UPSes keep using DSM's driver. Optional params: extra NUT driver options, e.g. '-x pollinterval=5'. Log: /var/log/rr-us3000.log"
system: false
params: true
all:
  install-script: "install.sh"
  copy: ""
